[project]
name = "api-to-do-list"
version = "0.10.1"
description = "Lista de Tarefas usando SQLite"
authors = [
    {name = "muniz",email = "muniz_157@outlook.com"}
]
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "fastapi[standard] (>=0.142.0,<0.143.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
